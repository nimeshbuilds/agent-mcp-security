<text x="297" y="176" fill="#ff8598" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">FN  false negative</text>
<text x="297" y="232" fill="#edf9fc" font-size="47" font-weight="700" text-anchor="start" letter-spacing="0">0</text>
<rect x="36" y="282" width="224" height="119" rx="10" fill="#102e3c"/>
