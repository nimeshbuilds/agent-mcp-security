<text x="55" y="369" fill="#edf9fc" font-size="47" font-weight="700" text-anchor="start" letter-spacing="0">0</text>
<rect x="278" y="282" width="224" height="119" rx="10" fill="#102e3c"/>
<text x="297" y="313" fill="#7da8f7" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">TN  true negative</text>
<text x="297" y="369" fill="#edf9fc" font-size="47" font-weight="700" text-anchor="start" letter-spacing="0">53</text>
<text x="566" y="177" fill="#aac4cd" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2">PRECISION</text>
