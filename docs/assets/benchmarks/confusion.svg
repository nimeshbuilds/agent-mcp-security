<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">The full confusion counts</title><desc id="desc">All fixture outcomes, including challenge cases. Precision and recall denominators are displayed explicitly.</desc>
