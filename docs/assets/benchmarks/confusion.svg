<text x="566" y="380" fill="#aac4cd" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">60 / 60 expected detections were found</text>
<text x="36" y="441" fill="#aac4cd" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">Includes every regression and challenge case. Unlabeled detections are not scored.</text>
<path d="M36 462H964" stroke="#294755"/>
<text x="36" y="488" fill="#aac4cd" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Positive = the named rule should fire. Negative = that rule should not fire; neither label proves safety.</text>
