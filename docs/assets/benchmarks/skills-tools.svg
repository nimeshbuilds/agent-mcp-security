<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" role="img" aria-labelledby="title desc">
<title id="title">Skills and tools: direct evidence, explicit limits</title><desc id="desc">Separate development-visible corpus. Every safe and adversarial label remains in the denominator; not a maliciousness or production safety score.</desc>
