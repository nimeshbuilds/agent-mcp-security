<text x="36" y="329" fill="#aac4cd" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Known semantic and language misses remain in the result. Optional AI can investigate bounded evidence; its</text>
<text x="36" y="352" fill="#aac4cd" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">judgment is advisory and does not establish detection guarantees.</text>
<path d="M36 387H964" stroke="#294755"/>
<text x="36" y="413" fill="#aac4cd" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Separate fixture scope: not added to the 113-assertion before/after denominator.</text>
