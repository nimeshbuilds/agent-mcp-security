<text x="36" y="117" fill="#aac4cd" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">81 cases / 331 explicit rule-presence assertions</text>
<rect x="36" y="148" width="216" height="142" rx="10" fill="#102e3c"/>
<text x="56" y="183" fill="#59dec2" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">TP</text>
<text x="56" y="248" fill="#edf9fc" font-size="48" font-weight="700" text-anchor="start" letter-spacing="0">43</text>
<rect x="272" y="148" width="216" height="142" rx="10" fill="#102e3c"/>
<text x="292" y="183" fill="#7da8f7" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">TN</text>
<text x="292" y="248" fill="#edf9fc" font-size="48" font-weight="700" text-anchor="start" letter-spacing="0">287</text>
<rect x="508" y="148" width="216" height="142" rx="10" fill="#102e3c"/>
<text x="528" y="183" fill="#ffc16f" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">FP</text>
