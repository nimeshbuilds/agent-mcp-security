<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" role="img" aria-labelledby="title desc">
<title id="title">A harder challenge exposed a real gap</title><desc id="desc">Initial unseen cases, fixes after disclosure, and a separate small temporal holdout. Every false negative and false alarm remains visible.</desc>
<rect width="1000" height="612" rx="24" fill="#081d29"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="42" fill="#59dec2" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2">INVARUNE  /  BENCHMARK LAB</text>
<text x="36" y="81" fill="#edf9fc" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">A harder challenge exposed a real gap</text>
<text x="36" y="115" fill="#aac4cd" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Same 32 authored cases: 16 risky predicates + 16 safe counterparts</text>
<text x="36" y="154" fill="#edf9fc" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">v0.14 baseline</text>
<rect x="36" y="170" width="67.5" height="23" rx="0" fill="#59dec2"/>
<rect x="103.5" y="170" width="360.0" height="23" rx="0" fill="#7da8f7"/>
<rect x="463.5" y="170" width="292.5" height="23" rx="0" fill="#ff8598"/>
<text x="36" y="219" fill="#aac4cd" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">3 TP / 16 TN / 0 FP / 13 FN</text>
<text x="36" y="256" fill="#edf9fc" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">v0.15 first blind candidate</text>
<rect x="36" y="272" width="90.0" height="23" rx="0" fill="#59dec2"/>
<rect x="126.0" y="272" width="360.0" height="23" rx="0" fill="#7da8f7"/>
<rect x="486.0" y="272" width="270.0" height="23" rx="0" fill="#ff8598"/>
<text x="36" y="321" fill="#aac4cd" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">4 TP / 16 TN / 0 FP / 12 FN</text>
<text x="36" y="358" fill="#edf9fc" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">v0.15 after disclosure (development)</text>
<rect x="36" y="374" width="360.0" height="23" rx="0" fill="#59dec2"/>
<rect x="396.0" y="374" width="360.0" height="23" rx="0" fill="#7da8f7"/>
<text x="36" y="423" fill="#aac4cd" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">16 TP / 16 TN / 0 FP / 0 FN</text>
<rect x="27" y="466" width="946" height="87" rx="10" fill="#102e3c"/>
<text x="43" y="494" fill="#59dec2" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0">SEPARATE 8-CASE FINAL SEALED CHECK</text>
<text x="43" y="528" fill="#edf9fc" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">2 TP / 4 TN / 0 FP / 2 FN</text>
<path d="M36 564H964" stroke="#294755"/>
<text x="36" y="590" fill="#aac4cd" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0">Within-project temporal holdout, not external validation. Post-disclosure improvements are development results.</text>
</g></svg>
