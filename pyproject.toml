[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp-security-scan"
version = "0.1.0"
description = "Deterministic, read-only AI agent and MCP source security triage with an optional advisory LLM judge"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-security-scan = "ai_security_scan.cli:main"

[tool.setuptools.packages.find]
include = ["ai_security_scan*"]

[tool.setuptools.package-data]
ai_security_scan = ["data/*.json"]
