[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp-security-scan"
version = "0.14.0"
description = "Invarune by NimeshBuild: deterministic AI agent and MCP source/image security triage with an optional advisory LLM analyst"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://nimeshbuilds.github.io/invarune/"
Documentation = "https://nimeshbuilds.github.io/invarune/docs/QUICKSTART/"
Repository = "https://github.com/nimeshbuilds/invarune"
Issues = "https://github.com/nimeshbuilds/invarune/issues"

[project.optional-dependencies]
ai = ["headroom-ai==0.37.0; python_version >= '3.10'"]
pdf = ["reportlab>=4.4.9,<5", "pypdf>=6.10.0,<7"]

[project.scripts]
invscan = "ai_security_scan.cli:main"
invarune = "ai_security_scan.cli:main"
ai-security-scan = "ai_security_scan.cli:main"

[tool.setuptools.packages.find]
include = ["ai_security_scan*"]

[tool.setuptools.package-data]
ai_security_scan = ["data/*.json"]
