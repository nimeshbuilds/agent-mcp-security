name: Invarune documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation tooling
        run: python -m pip install -r requirements-docs.txt
      - name: Validate benchmark data and chart provenance
        run: |
          python scripts/build_scan_coverage.py --check
          python scripts/build_benchmark_dashboard.py --check
          python scripts/build_benchmark_update.py --validate-only
          python scripts/build_benchmark_update.py --input-dir benchmarks/comparison-v014 --validate-only
          python scripts/build_benchmark_update.py --input-dir benchmarks/comparison-v015 --validate-only
      - name: Stage indexed documentation and public artifacts
        run: python scripts/prepare_docs.py
      - name: Build with strict links and anchors
        run: python -m mkdocs build --strict
      - name: Verify links, search and unchanged artifact bytes
        run: python scripts/verify_docs_site.py --receipt site/site-validation.json
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: invarune-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
