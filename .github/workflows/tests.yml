name: Invarune tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.12', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline and loopback integration tests
        run: python -m unittest discover -s tests -v
      - name: Check labeled static rule accuracy
        run: python scripts/evaluate_accuracy.py --format markdown
      - name: Scan safer comparison fixture
        run: python scan.py examples/safer --output test-output/safer
      - name: Validate the installed Windows quickstart in a fresh environment
        if: matrix.os == 'windows-latest'
        run: python scripts/validate_quickstart.py --skip-pdf --skip-gateway --output test-output/quickstart-windows

  headroom-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify installed invscan and actual Headroom on all six loopback protocols
        run: python scripts/validate_quickstart.py --skip-pdf --output test-output/quickstart-headroom

  package-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install optional QA tools
        run: python -m pip install -r requirements-qa.txt
      - name: Measure branch and line coverage
        run: python -m coverage run --branch --source=ai_security_scan -m unittest discover -s tests -v
      - name: Show coverage evidence
        run: python -m coverage report --show-missing
      - name: Build and install the wheel without target dependencies
        run: |
          python -m pip wheel --no-deps --wheel-dir test-output/wheels .
          python -m pip install --no-deps test-output/wheels/*.whl
      - name: Verify installed primary and legacy source commands from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          from importlib.metadata import distribution
          package = distribution('agent-mcp-security-scan')
          scripts = {entry.name: entry.value for entry in package.entry_points if entry.group == 'console_scripts'}
          assert scripts['invscan'] == scripts['invarune'] == scripts['ai-security-scan'] == 'ai_security_scan.cli:main'
          artifacts = []
          for command, folder in (('invscan', 'installed-scan'), ('invarune', 'installed-compatible-scan'), ('ai-security-scan', 'installed-legacy-scan')):
              output = pathlib.Path(os.environ['RUNNER_TEMP']) / folder
              source = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'examples/safer'
              subprocess.run([command, str(source), '--output', str(output)], check=True)
              version = subprocess.run([command, '--version'], capture_output=True, text=True, check=True)
              assert version.stdout.strip() == package.version
              report = json.loads((output / 'report.json').read_text())
              assert report['tool']['name'] == 'agent-mcp-security-scan'
              assert report['tool']['display_name'] == 'Invarune by NimeshBuild'
              artifacts.append({name: (output / name).read_bytes() for name in ('report.html', 'report.json', 'report.md', 'report.sarif')})
          assert all(item == artifacts[0] for item in artifacts[1:])
          print('Installed branded and legacy commands emit identical source reports.')
          PY
      - name: Verify comprehensive help ships in the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import subprocess
          references = []
          for command in ('invscan', 'invarune', 'ai-security-scan'):
              outputs = []
              for flag in ('-h', '--help'):
                  result = subprocess.run([command, flag], capture_output=True, text=True, check=True)
                  assert not result.stderr
                  assert 'Custom JSON gateway configuration:' in result.stdout
                  assert 'Container images without a source checkout:' in result.stdout
                  assert 'compatible legacy alias' in result.stdout
                  assert 'Review config JSON shape:' in result.stdout
                  assert '--review-config' in result.stdout
                  assert '--review-report' in result.stdout
                  assert '--pdf' in result.stdout
                  assert '--help-topic' in result.stdout
                  assert '--examples' in result.stdout
                  assert '--token-optimizer' in result.stdout
                  assert '--ask' in result.stdout
                  assert '--explain-control' in result.stdout
                  assert '--catalog-format' in result.stdout
                  outputs.append(result.stdout)
              assert outputs[0] == outputs[1]
              references.append(outputs[0].split('Invarune by NimeshBuild', 1)[1])
              for topic in ('ai', 'review', 'images', 'gateways', 'security'):
                  result = subprocess.run([command, '--help-topic', topic], capture_output=True, text=True, check=True)
                  assert 'invscan' in result.stdout and not result.stderr
              examples = subprocess.run([command, '--examples'], capture_output=True, text=True, check=True)
              assert '--token-optimizer' in examples.stdout and '--image-archive' in examples.stdout
          assert all(item == references[0] for item in references[1:])
          print('Both installed commands include the same complete offline reference.')
          PY
      - name: Verify the installed deterministic security explorer
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, subprocess
          for command in ('invscan', 'invarune', 'ai-security-scan'):
              for arguments, key, identifier in (
                  (['--explain-control', 'AUTH-01'], 'control', 'AUTH-01'),
                  (['--explain-check', 'AUTH-01:1'], 'check', 'AUTH-01:1'),
                  (['--explain-source', 'MITRE-ATLAS'], 'source', 'MITRE-ATLAS')):
                  result = subprocess.run([command, *arguments, '--catalog-format', 'json'], capture_output=True, text=True, check=True)
                  value = json.loads(result.stdout)
                  assert not result.stderr and value[key]['id'] == identifier
                  assert value['mode'] == 'deterministic_catalog'
              result = subprocess.run([command, '--ask', 'prompt injection'], capture_output=True, text=True, check=True)
              assert not result.stderr and 'AGT-03' in result.stdout
              result = subprocess.run([command, '--list-sources', '--catalog-format', 'json'], capture_output=True, text=True, check=True)
              assert len(json.loads(result.stdout)['sources']) == 75
          print('All installed aliases expose grounded offline catalog explanations.')
          PY
      - name: Verify all five installed report review formats on source and image fixtures
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/validate_report_review.py" --command invscan --output "$RUNNER_TEMP/installed-report-review"
      - name: Exercise installed image scanner without a container runtime
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          archive = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'examples/images/demo-agent.tar'
          artifacts = []
          for command, folder in (('invscan', 'installed-image-scan'), ('invarune', 'installed-compatible-image-scan'), ('ai-security-scan', 'installed-legacy-image-scan')):
              output = pathlib.Path(os.environ['RUNNER_TEMP']) / folder
              result = subprocess.run([command, '--image-archive', str(archive), '--output', str(output)], check=False)
              assert result.returncode == 1
              report = json.loads((output / 'report.json').read_text())
              assert report['summary']['open_findings'] == 3
              assert report['summary']['coverage_gaps'] == 0
              assert report['image']['container_started'] is False
              artifacts.append({name: (output / name).read_bytes() for name in ('report.html', 'report.json', 'report.md', 'report.sarif')})
          assert all(item == artifacts[0] for item in artifacts[1:])
          print('Installed branded and legacy commands emit identical image reports.')
          PY
      - name: Verify installed review dispositions for source and image inputs
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          from ai_security_scan.rules import RULES
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          policy = temp / 'trusted-review.json'
          policy.write_text(json.dumps({'schema_version': '1.0',
              'rules': {r['id']: {'status': 'justified', 'reason': 'Installed-package CI fixture only.'} for r in RULES},
              'controls': {'GOV-01': {'status': 'disabled'}},
              'checks': {'AUTH-01:2': {'status': 'justified', 'reason': 'External review fixture.'}}}))
          for name, target, observed in (('source', [str(root / 'examples/vulnerable')], 11),
                                         ('image', ['--image-archive', str(root / 'examples/images/demo-agent.tar')], 3)):
              artifacts = []
              for command in ('invscan', 'invarune', 'ai-security-scan'):
                  output = temp / ('installed-reviewed-' + name + '-' + command)
                  process = subprocess.run([command, *target, '--review-config', str(policy), '--output', str(output), '--summary-json'],
                                           capture_output=True, text=True, check=True)
                  summary = json.loads(process.stdout)
                  report = json.loads((output / 'report.json').read_text())
                  assert summary['summary']['open_findings'] == 0
                  assert summary['summary']['justified_findings'] == observed
                  assert summary['coverage']['total_checks'] == 129
                  assert summary['coverage']['catalog_checks'] == 132
                  assert report['review_policy']['counts']['active_rules'] == 0
                  assert all(f['status'] == 'justified' for f in report['findings'])
                  assert report['assessment']['posture']['code'] == 'configured_exceptions'
                  artifacts.append({p.name: p.read_bytes() for p in output.glob('report.*')})
              assert all(item == artifacts[0] for item in artifacts[1:])
          print('Installed source/image exceptions preserve audit evidence, exclude active counts, and match across aliases.')
          PY
      - name: Validate generated SARIF against the pinned OASIS schema
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 30 https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json --output test-output/sarif-schema.json
          python scripts/validate_sarif.py --schema test-output/sarif-schema.json "$RUNNER_TEMP/installed-scan/report.sarif" "$RUNNER_TEMP/installed-image-scan/report.sarif" examples/reports/vulnerable/report.sarif "$RUNNER_TEMP/installed-reviewed-source-invarune/report.sarif" "$RUNNER_TEMP/installed-reviewed-image-invarune/report.sarif"

  built-image-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Inspect actual Docker-built artifacts without starting containers
        run: python scripts/validate_image_scan.py
